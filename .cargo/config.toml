[build]
# `[build] rustflags` applies to EVERY target, cross-compiles included, and
# `target-cpu=native` means "the CPU cargo is running on" — which is meaningless
# for a cross-target and produces pages of "not a recognized processor" chatter
# that buries real diagnostics. Every cross-compiled triple therefore needs its
# own `[target.<triple>]` entry below to displace this.
#
# Cargo does NOT merge the two: when a `[target.<triple>]` entry matches,
# `[build] rustflags` is ignored ENTIRELY (not appended to). That is the
# mechanism the entries below already rely on — and it is why an empty
# `rustflags = []` is a meaningful override rather than a no-op.
#
# ADDING A NEW CROSS-TARGET? Add an entry here or it silently inherits this
# host-only flag. See docs/gaps.md GAP-164.
rustflags = ["-C", "target-cpu=native"]

# Displaces the host's `target-cpu=native` for the aarch64 cross-check
# (scripts/aarch64-cross-check.ps1). `generic` rather than a specific Apple
# core: this target is type-checked here and never executed, so any tuning
# choice would be unverifiable — while `native` is an outright lie, naming an
# x86 core to an ARM target. NEON is baseline-mandatory in ARMv8, so `generic`
# still compiles the NEON paths this gate exists to reach.
#
# MUST BE NON-EMPTY. `rustflags = []` does NOT displace `[build] rustflags` —
# cargo treats an empty list as unset and falls back, so the host flag returns
# silently. Measured: with `[]` the aarch64 check still emitted 4816 "not a
# recognized processor" lines. A no-op fix that looks like a fix.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=generic"]


[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=-avx,-avx2"]

# ── [env] — cap the CUDA forge on the UNWRAPPED path (GAP-151) ───────────────
# `baracuda-kernels-sys`'s build script forges UNCONDITIONALLY — it never
# consults the `cuda` feature — so `cargo check --workspace --all-targets` at
# DEFAULT features IS a CUDA build, and it touches NEITHER
# `scripts/cuda-build.ps1` NOR its `BARACUDA_FORGE_THREADS` cap. Without this,
# that accidental path forges at full width (~11 nvcc on this box). This applies
# the protocol K to it, so the cap is enforced for the repo, not only for wrapped
# builds.
#
# PLAIN `[env]`, NOT `force = true` — and the ABSENCE of `force` is load-bearing,
# so it is defended here rather than instructed. `cuda-build.ps1` sets
# `BARACUDA_FORGE_THREADS` as an AMBIENT variable; a plain `[env]` DEFERS to an
# ambient value, so a wrapped build still gets the protocol value the wrapper
# chose. Measured with a build-script probe (a build script is the surface the
# forge runs on):
#     [env]="4", no ambient   -> build script observes 4   (unwrapped path capped)
#     [env]="4", ambient=9    -> build script observes 9   (wrapper still wins)
#     force=true, ambient=9   -> build script observes 4   (force DEFEATS the wrapper)
# `force` would override the wrapper's value, and the failure is near-invisible:
# `cuda-build.ps1:290` would still print "OVERRIDING pre-existing BARACUDA_FORGE_
# THREADS…" (it DID set the variable) while cargo silently ignored it — a protocol
# reporting success while being overridden, which is worse than one that fails.
# Only `baracuda-forge` reads this variable (`parallel.rs:98`); `RAYON_NUM_THREADS`
# would perturb every rayon consumer, which is an argument for this knob over that.
[env]
BARACUDA_FORGE_THREADS = "4"