# CodeRipper's own file for this repository (read by `coderipper sweep`, see its README, "Members that cannot be
# built where the run is"). A declared skip is printed as "not judged (declared skip)", is not a failure, and hides no
# finding from any member that is built.

[[skip_member]]
name = "fuel-metal-kernels"
needs = "xcrun"
reason = "compiles to nothing off macOS, so coderipper's per-run positive controls (sentinel functions) cannot fire"
owner = "fuel lane"

[[allow]]
check = "SEC-002"
file = "fuel-dispatch/src/dispatch.rs"
lines = "5008"
reason = "gitleaks false positive in HISTORY, not in the tree. Commit 734febbdd on main (the CPU shape-ops FKC-contract registration migration; an earlier copy of the same change, ea224011d, lives on other branches and is not on main) carries a code comment at this line that lists op names after the word for registration lookups, and the rule read that word as the name of a credential. Nothing in it is one. The line number is fixed because the finding sits in that immutable commit, so the entry does not move when dispatch.rs changes; the file at HEAD has other text at line 5008."

[[allow]]
check = "SUP-004"
file = "fuel/tests/facade_disjoint.rs"
reason = "workspace-only test, reads fuel-transformers/src/models/mod.rs (facade/workspace consistency test). A published tarball cannot compile tests/ anyway (workspace dev-dependencies are path-only and cargo publish strips them), so nothing downstream reads outside the crate. Already recorded, with the same count, in the ratcheted scripts/packaged-escapes-allowlist.txt, which fails if an escape is added or removed without updating it."

[[allow]]
check = "SUP-004"
file = "fuel/tests/feature_forwarding.rs"
reason = "workspace-only test, reads three sibling Cargo.toml files (feature-forwarding consistency test). A published tarball cannot compile tests/ anyway (workspace dev-dependencies are path-only and cargo publish strips them), so nothing downstream reads outside the crate. Already recorded, with the same count, in the ratcheted scripts/packaged-escapes-allowlist.txt, which fails if an escape is added or removed without updating it."

