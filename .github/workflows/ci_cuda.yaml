# ⚠️ THIS WORKFLOW HAS NEVER EXECUTED A SINGLE STEP IN THIS REPOSITORY.
#
# MEASURED 2026-08-13: 16 runs from 2026-04-10 to date, all `failure`, and every
# one reports `steps: []`, `runner_group_name: null`, `labels: []`, with
# `started_at == completed_at`. There are no logs to read because nothing ran.
#
# CAUSE — not a broken or busy runner, and not fixable by re-running:
# `runs-on: group: aws-g5-4xlarge-cache` is HUGGINGFACE's runner group. It
# arrived with the Candle fork (`ab56dfee "Update CI (#3194)"` — an upstream PR
# number), and this repository is `ciresnave/fuel`, which has never had access
# to that pool. The job asks for another organization's runners, so it is never
# assigned one. Correct upstream; meaningless here since the fork.
#
# CONSEQUENCE: every claim of the form "CUDA is covered in CI" is currently
# false, including for `cargo test --features cuda` below. Nobody has been
# ignoring a failing CUDA test — there has never been a runner for one to fail
# on. Anything that must actually be enforced needs a target that exists; the
# telemetry-only half of the check below is in `rust-ci.yml` for that reason.
#
# KEPT DELIBERATELY, NOT DEAD CONFIG: whether to delete this, self-host a
# runner, or point it at a hosted GPU target is CireSnave's decision, not a
# tidy-up. Do not "fix" it by silently swapping the runner.

name: CI / cuda

on:
  workflow_dispatch:
  pull_request:

jobs:
  test-cuda:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    runs-on:
      group: aws-g5-4xlarge-cache
    container:
      image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
    if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
    permissions:
      contents: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      security-events: write
    env:
      CUDA_COMPUTE_CAP: 86
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: apt update && apt install curl build-essential libssl-dev protobuf-compiler pkg-config -y
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # WHY THIS LIVES ON THE CUDA RUNNER, AND WHY IT IS NOT `cargo test --features cuda`.
      #
      # `fuel-dispatch/src/telemetry/` is reachable only under `telemetry`, and
      # `telemetry/baracuda_provider.rs` needs `telemetry` AND `baracuda-types`.
      # `telemetry` appears in NO other job, and `--features cuda` below enables
      # `baracuda-types` but NOT `telemetry` — so before this step, NOTHING in CI
      # compiled that module. One feature is not two: a gate covering each
      # feature separately covers no intersection. (GAP-173, GAP-179.)
      #
      # DO NOT MOVE THIS TO A CHEAPER RUNNER. `baracuda-types` pulls
      # `baracuda-kernels-types`, which reaches `baracuda-cuda-sys`, whose build
      # script requires the CUDA SDK to be present. This container has it; the
      # plain rust-ci runners do not, and there the step fails for a reason that
      # has nothing to do with the code.
      #
      # It does NOT forge kernels: `baracuda-kernels-types` is `build = false`
      # and does not depend on `baracuda-kernels-sys`. Seconds, not minutes —
      # which is why it runs BEFORE the `--features cuda` step and fails fast
      # ahead of the kernel forge rather than after it.
      #
      # What it protects: the exhaustive `DType` matches at Fuel's wire boundary
      # to KISS (`telemetry/structure_key_derive.rs`, the sk4 codec) and the
      # `ArchSku` witness in `baracuda_provider.rs`, which is designed to fail to
      # compile when a baracuda bump adds an arch variant. That bump arrives as a
      # PR that changes no Fuel source, so this job is the only place the trap
      # can fire for the person who needs to see it.
      - name: Check (telemetry + baracuda-types)
        run: cargo check -p fuel-dispatch --features telemetry,baracuda-types --all-targets
      - name: Test (cuda)
        run: cargo test --features cuda
