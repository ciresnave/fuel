on:
  push:
    branches:
      - main
  pull_request:

name: Continuous integration

# ⚠️ `--workspace` HERE IS NOT "the whole repo builds" — it excludes FIVE
# crates, and every job below that uses `$WORKSPACE_EXCLUDES` is making a
# NARROWER claim than it looks like. Never report a green from this workflow as
# "workspace-clean" without naming these.
#
# ⚠️ COMMENT CORRECTED 2026-08-20 (measured; the EXCLUSION LIST IS UNCHANGED).
# This block said "three crates" and described four; the list below has FIVE,
# and `fuel-cuda-backend` was excluded here without ever being mentioned in the
# prose. An undercount in a comment whose whole job is naming what a green does
# NOT cover.
#
#   fuel-metal-backend / fuel-metal-kernels
#       `objc2` hard-errors "only works on Apple platforms" on any non-Apple
#       target — but ONLY ONE of these two crates is actually killed by it.
#       Measured at head on Windows, one crate at a time:
#         fuel-metal-kernels  -> FAILS, `could not compile objc2`
#         fuel-metal-backend  -> BUILDS CLEAN, exit 0
#       ⚠️ And the old premise here — "deliberately kept OFF `default-members`
#       so a plain `cargo build` works without Apple toolchains" — is FALSE at
#       head: `fuel-metal-backend` IS in `default-members` (27 entries, parsed
#       from the root manifest). It is stated as false rather than dropped,
#       because the premise is what a reader would otherwise re-derive.
#       ⚠️ THE `fuel-metal-backend` EXCLUSION IS THEREFORE CONSERVATIVE, NOT
#       NECESSARY — and it STAYS. Removing it would WIDEN what CI compiles, and
#       the measurement above is WINDOWS-ONLY: "it builds here" is not "it
#       builds on the ubuntu/macOS runners". Widening a gate is a separate
#       decision needing a runner measurement, and this is not it.
#       The macOS "Run macos with metal" step deliberately does NOT use this
#       variable: it is the only job on the matrix that can compile Metal, and
#       therefore the only Metal coverage that exists anywhere.
#
#   fuel-mkl-cpu-backend / fuel-aocl-cpu-backend
#       MISSING-SDK exclusions, a different reason from the Metal pair (which is
#       wrong-platform). `onemkl-sys` needs a oneMKL install and `aocl-build`
#       panics outright — "Could not locate AOCL. Install AOCL … and set
#       AOCL_ROOT" — and no hosted runner has either. Both deps are
#       NON-OPTIONAL in their crates (no feature gate), so `--workspace` builds
#       them unconditionally on every OS.
#
#   fuel-cuda-backend
#       Its `baracuda-kernels-sys` build script forges CUDA kernels
#       UNCONDITIONALLY — it does not consult the `cuda` feature — and panics
#       `NvccNotFound` when nvcc is absent, which it is on every hosted runner.
#       ⚠️ NOTE WHAT THIS COSTS: CUDA code is therefore NOT COMPILED BY CI AT
#       ALL. That is a real coverage hole, stated here rather than discovered
#       later from a green badge. It is currently unavoidable — a runner with
#       CUDA, or a build script that degrades instead of panicking (a
#       propose-first ask to baracuda, a sibling project), are the two ways out.
#
#       Every dependent declares it `optional = true` behind a `cuda` feature,
#       so nothing pulls it into a default build except its WORKSPACE
#       MEMBERSHIP — which is also why excluding it removes the forge from the
#       graph entirely rather than merely skipping one crate.
#
#       ⚠️ `fuel-aocl-cpu-backend` is the one that is INVISIBLE LOCALLY, and it
#       is why CLAUDE.md's stated "honest workspace gate" (which names only the
#       Metal pair and MKL) is incomplete: the dev box has AOCL installed, so
#       that crate compiles there and fails only in a clean environment. Same
#       shape as the private-git-rev that took CI down — a developer machine
#       cannot see it by construction. Do not trust a local `--workspace` green
#       as evidence about CI.
#
# The Metal and MKL arms are therefore UNVERIFIED on Linux/Windows/arm. That is
# a known and stated hole, not an oversight.
#
# Written as a GitHub expression (`${{ env.WORKSPACE_EXCLUDES }}`) at each use
# rather than a shell variable: the "Run normal cpu" step runs on BOTH ubuntu
# and windows, and `$VAR` does not expand in PowerShell, which is the default
# shell on Windows runners. The runner substitutes the expression before any
# shell sees it, so one spelling works on every OS.
env:
  # WORKSPACE_EXCLUDES = the missing-SDK crates + the wrong-platform pair.
  WORKSPACE_EXCLUDES: >-
    --exclude fuel-mkl-cpu-backend
    --exclude fuel-aocl-cpu-backend
    --exclude fuel-cuda-backend
    --exclude fuel-metal-backend
    --exclude fuel-metal-kernels
  # macOS CAN build the Metal crates, so it excludes only the missing-SDK pair.
  # Kept separate rather than folded into the list above: the two groups have
  # different causes and different lifetimes — the Metal exclusion ends if a job
  # ever targets Apple, the SDK ones end only if a runner gains oneMKL/AOCL.
  # These two lists MUST stay in sync on the SDK half; if you add a third
  # missing-SDK crate it belongs in BOTH.
  MACOS_EXCLUDES: >-
    --exclude fuel-mkl-cpu-backend
    --exclude fuel-aocl-cpu-backend
    --exclude fuel-cuda-backend

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, windows-latest, macOS-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Remove cargo config (macOS ring crate fix)
        if: runner.os == 'macOS'
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable

      # `fuel-onnx`'s build script calls `prost_build::compile_protos`, and
      # prost-build 0.13 does NOT bundle a `protoc` (dropped in 0.11) — so
      # without one the crate fails at BUILD SCRIPT time, before compiling a
      # line, and takes the whole `--workspace` job with it.
      #
      # INSTALLED rather than excluded, deliberately, and the distinction from
      # the exclusion list above is the point: CUDA / oneMKL / AOCL / Metal are
      # heavy or platform-impossible on a hosted runner, so excluding them is
      # the only option and costs real coverage. `protoc` is a small package
      # available on every platform, so installing it KEEPS fuel-onnx covered
      # for a few seconds of CI time. Prefer installing a missing tool over
      # excluding a crate whenever the tool is actually installable.
      - name: Install protoc (fuel-onnx build script)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the Metal crates — this is the ONLY job that can compile
      # fuel-metal-backend / fuel-metal-kernels, so it is the only Metal
      # coverage in the entire matrix. Do not "make it consistent" with the
      # others by adding the Metal excludes here; consistency would mean nothing
      # builds Metal at all.
      #
      # It DOES need the MKL exclusion, for the unrelated reason: `onemkl` is a
      # NON-optional dependency of fuel-mkl-cpu-backend with no feature gate, so
      # `--workspace` builds `onemkl-sys` on macOS exactly as it does on Linux,
      # and no hosted runner has oneMKL. Metal is a wrong-platform exclusion;
      # MKL is a missing-SDK one, and macOS needs the second but not the first.
      - name: Run macos with metal
        if: matrix.os == 'macOS-latest'
        run: cargo check --workspace --features metal ${{ env.MACOS_EXCLUDES }}

      - name: Run normal cpu
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        run: cargo check --workspace ${{ env.WORKSPACE_EXCLUDES }}

      - name: Run with avx2
        if: matrix.os == 'ubuntu-24.04'
        run: |
          export RUSTFLAGS="-C target-feature=avx2"
          cargo check --workspace ${{ env.WORKSPACE_EXCLUDES }}

      - name: Run with arm neon
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          export RUSTFLAGS="-C target-feature=neon"
          cargo check --workspace ${{ env.WORKSPACE_EXCLUDES }}

      # `fuel-dispatch/src/telemetry/` is gated on the non-default `telemetry`
      # feature, so `cargo check --workspace` above — which uses default
      # features — does not parse a single file in it. That includes
      # `telemetry/structure_key_derive.rs`, whose wildcard-free `DType` matches
      # are what make "a new Fuel dtype is a compile error BEFORE it can reach
      # the wire" true at Fuel's sk4 boundary to KISS. Until this step, nothing
      # in any workflow compiled it. (GAP-173.)
      #
      # Needs no CUDA and no SDK — `telemetry = ["fuel-ir/serde"]` pulls no
      # baracuda dependency — so it belongs on an ordinary runner. MEASURED, not
      # assumed: seeding a non-exhaustive match in that file makes exactly this
      # command exit 101 with E0004, while `cargo check -p fuel-dispatch
      # --all-targets` (default features) stays exit 0.
      #
      # Runs on one OS deliberately: this checks feature-gated compilation, which
      # is platform-independent, so a matrix would buy five copies of one answer.
      #
      # NOT the whole module, and the remainder is currently UNCOVERED.
      # `telemetry/baracuda_provider.rs` additionally needs `baracuda-types`,
      # which reaches `baracuda-cuda-sys` and therefore requires the CUDA SDK to
      # be PRESENT (its build script is 321 bytes and invokes no nvcc, so nothing
      # is forged — this is an SDK requirement, not a GPU one).
      #
      # That step used to live in ci_cuda.yaml. THAT WORKFLOW WAS DELETED
      # (GAP-181): it requested HuggingFace's `aws-g5-4xlarge-cache` runner
      # group, inherited from the Candle fork, and so never executed a single
      # step in 16 runs across four months. CireSnave's ruling: a CI workflow
      # that requires CUDA will never run here, so remove it rather than let a
      # red X stand in for coverage.
      #
      # The residual gap is real and deliberately NOT papered over. Restoring it
      # needs an SDK-bearing runner WITHOUT a GPU — e.g. this job in an
      # `nvidia/cuda:*-devel` container on ordinary ubuntu-latest, since the
      # check only compiles. That is a CANDIDATE, not a plan: nobody has
      # demonstrated it, and per GAP-181 an unrun CI step must never be
      # described as coverage. Demonstrate it failing before claiming it works.
      - name: Check telemetry-gated dispatch (sk4 wire codec)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-dispatch --features telemetry --all-targets

      # ── Non-default FEATURE compile coverage (GAP-233) ──────────────────
      # `cargo check --workspace` above uses DEFAULT features, and its exclude
      # list drops fuel-cuda-backend, so before this pair NO step in any
      # workflow compiled a single line behind `--features vulkan` or
      # `--features jit`. `--features telemetry` had a step (above); these two
      # did not, and `cuda` still does not (see UNCOVERED below).
      #
      # That gap was not hypothetical. Commit 68161981 renamed a binding to
      # `_n_bytes` via an `unused_variables` --fix run at DEFAULT features,
      # where its only use sits behind `#[cfg(feature = "vulkan")]`. main was
      # RED under `--features vulkan` (E0425 x2 in fuel-dispatch) and GREEN on
      # every CI check for 72 minutes, until a human noticed (fixed f98b4b58).
      # `unused_variables` is the lint that MOST reliably does this — "unused"
      # is exactly the property a cfg gate manufactures — and the sweep that
      # generated it (GAP-229) is ongoing.
      #
      # BORN-RED, OBSERVED IN CI (not inferred) — a CI job whose failure nobody
      # recorded becomes an unproven gate again in six weeks, so both runs are
      # named here:
      #   * LIB regression: re-seeding the `_n_bytes` rename makes THIS step fail
      #     `could not compile fuel-dispatch (lib)` E0425, while "Run normal cpu"
      #     (--workspace, DEFAULT features) and the telemetry step both PASS — the
      #     seed is invisible at default, which is the whole point.
      #     PR #20, run 32934164792, step "Check vulkan-gated compilation".
      #   * TEST-TARGET regression: a nonexistent symbol inside the vulkan-gated
      #     test `vulkan_dispatch_live` makes THIS step fail `could not compile
      #     fuel-dispatch (test "vulkan_dispatch_live")` E0425 — proving the
      #     two-crate `--all-targets` form reaches fuel-dispatch's OWN test
      #     targets, not merely its lib (the one-crate form already caught lib
      #     regressions; the test target is what this change bought).
      #     Run 32935028995, same step.
      #   Both seeds were reverted before merge.
      #
      # Pure-host, seconds-scale: neither feature pulls a baracuda dependency,
      # so no nvcc, no forge, no SDK. One OS deliberately — feature-gated
      # compilation is platform-independent, so a matrix buys copies of one
      # answer. The vulkan-gated code lives in the CONSUMERS (fuel-core /
      # fuel-dispatch); fuel-vulkan-backend itself is a default-member already
      # compiled by "Run normal cpu".
      #
      # Both consumers are named with `--all-targets` in ONE invocation so
      # fuel-dispatch's OWN vulkan-gated TEST targets (`vulkan_dispatch_live`)
      # compile too — `-p fuel-core --features vulkan` alone builds only
      # fuel-dispatch's LIB, and a vulkan-gated test is the code most likely to
      # reference a binding nobody else uses (n_bytes happened to be lib code,
      # which is exactly why a lib-only gate would have missed the CLASS while
      # catching the instance). `fuel-core/vulkan` forwards to
      # `fuel-dispatch/vulkan`; one invocation resolves features once and shares
      # a cache — two `-p` legs resolve differently and share none (that cost
      # 2.5h on the CUDA gate once). The artifact that proves the test targets
      # built is `fuel-dispatch (lib test)` in this step's log, NOT a bare
      # `Checking fuel-dispatch` line.
      #
      # STILL UNCOVERED, named so a green badge does not imply otherwise:
      #   * `cuda` — `baracuda-kernels-sys` forges UNCONDITIONALLY, so any job
      #     merely selecting fuel-cuda-backend pays a ~1h forge and needs nvcc.
      #     A runner question (GAP-181), not a third flag here.
      #   * `metal` off Apple, and the mkl/aocl/accelerate/onemkl SDK-gated
      #     backends — same reasons as WORKSPACE_EXCLUDES at the top of file.
      - name: Check vulkan-gated compilation (GAP-233)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-core -p fuel-dispatch --features fuel-core/vulkan --all-targets
      - name: Check jit-gated compilation (GAP-233)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-dispatch --features jit --all-targets
      # `dlpack` is default-off and, before this step, NO workflow compiled a line
      # behind `--features dlpack` — so fuel-ir's exhaustive `DType`→FDX match
      # (`dlpack::convert::dtype_to_fdx`, the §6.1 wire codec) and fuel-memory's
      # `dlpack_view` consumer had no gate at all. That match went RED on
      # `DType::Bool` (E0004, convert.rs:62) while every default CI check stayed
      # GREEN — exactly the invisible-behind-a-feature class this section
      # documents. Pure-host, seconds: no baracuda, no SDK, no GPU. Both crates in
      # ONE invocation so features resolve once and share a cache; `--all-targets`
      # so the born-reds in BOTH crates' test targets compile — the artifacts that
      # prove that are `fuel-ir (lib test)` and `fuel-memory (lib test)`, not a
      # bare `Checking` line.
      #
      # ⚠️ This is a COMPILE gate, NOT a lint gate. The `check` job does not set
      # `-D warnings` (only Clippy does, and Clippy runs DEFAULT features, so it
      # never sees `dlpack`). A GREEN here means the cell BUILDS, not that it is
      # clean: it passes fuel-memory's known-benign `PACKING_BYTE_ALIGNED`
      # dead-code warning today and will pass a future `--features dlpack` warning
      # the same way. (That constant is a hand-maintained mirror of the §6.1
      # FDXPacking table whose own doc names its expiry — export the named
      # constants from `dlpack::codes` and the mirror stops existing; tracked
      # separately as the manual-mirror class.) Revisit whether this leg earns
      # `-D warnings` once that resolves.
      #
      # BORN-RED, OBSERVED IN CI (not inferred), per GAP-233's bar. Seeding a
      # `dlpack`-gated `const _ = NO_SUCH_CONST;` into fuel-ir/src/dlpack/convert.rs
      # made THIS step go RED while every other check in the SAME run stayed GREEN
      # — the in-CI form of the local `leg=101 / default=0` pair, and it forecloses
      # the reading "CI went red, maybe the branch is just broken." One run, both
      # arms:
      #   RED (dlpack step, seed present):
      #     https://github.com/ciresnave/fuel/actions/runs/33129652417/job/98715936288#step:14:1
      #   GREEN baseline (same step, no seed, clean main @8e0bad4f):
      #     https://github.com/ciresnave/fuel/actions/runs/33128922289/job/98713605205#step:14:1
      # The seed's LOCATION is the load-bearing evidence: it reddens FROM
      # convert.rs (fuel-ir arm) — and equally from dlpack_view.rs (fuel-memory
      # arm, verified locally the same way) — which proves the leg reaches WHICH
      # code (the wire codec and the view), not merely that the invocation runs.
      # That is what separates this leg from one that reddens while parsing none of
      # its feature's code (the baracuda-types near-miss, GAP-247). To re-verify or
      # extend this leg, the seed MUST land in a `dlpack`-gated region of the crate
      # under test, never anywhere the invocation merely touches.
      - name: Check dlpack-gated compilation (GAP-233; §6.1 wire codec)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-ir -p fuel-memory --features fuel-memory/dlpack --all-targets

      # ── Non-default FEATURE compile coverage, second tranche (GAP-247) ──
      # A 45-cell census measured every non-default feature NO CI step names.
      # Seven were built; THREE had rotted. The rate is the argument: these are
      # not a tail. Instances found, worst first:
      #   * fuel-cpu-backend --features mkl  — 19 errors incl. `extern blocks
      #     must be unsafe` (edition-2024) and unstable `f16`. A DEFAULT-MEMBER,
      #     so every job builds the crate and the rot hides behind the feature.
      #     ONE defect, SIX cells: all `mkl` cells chain to it. NOT gated below
      #     — a leg over a cell that does not compile would be born red and stay
      #     red; it is filed for dedicated repair first.
      #   * fuel-ir --features dlpack — E0004, `DType::Bool` never added to the
      #     DLPack conversion. Also a default-member. CLOSED: fixed in #24, and
      #     its leg is the "Check dlpack-gated compilation" step above — which
      #     also unblocked `fuel-memory --features dlpack`, a cell this sweep
      #     could only record as NO RESULT because it died inside fuel-ir. Now
      #     measured: COMPILES, with a dead-code warning
      #     (`PACKING_BYTE_ALIGNED`) that had been invisible for the life of the
      #     code because nothing ever built the cell.
      #   * fuel-aocl-cpu-backend / fuel-mkl-cpu-backend — CI-excluded, fixed
      #     separately; MKL was ENTIRELY uncompilable, library included.
      #
      # ⚠️ WHAT A GREEN HERE MEANS, AND WHAT IT DOES NOT. These are `check`
      # steps: green means the cell COMPILES. `check` sets no `-D warnings`, so
      # a leg passes a future warning exactly as it passes today's — the dlpack
      # cell emitted a dead-code warning the first time anything ever built it,
      # invisible for the life of the code. Do NOT read a green here as "this
      # cell is clean".
      #
      # BORN-RED, two forms, and THE WEAK FORM MISSED A VACUOUS LEG — which is
      # the reason the strong form is recorded here rather than assumed.
      #
      #   WEAK: re-point each invocation at `-p fuel-cpu-backend --features mkl`
      #   (a cell measured broken). All four went RED, then green again when
      #   pointed back. This proves only that the STEP SHAPE reddens.
      #
      #   STRONG: seed `#[cfg(feature = X)] const .. = <undefined>;` in the
      #   crate's own gated region and require BOTH (a) the leg goes RED and
      #   (b) a DEFAULT build stays GREEN — (b) is what proves the seed is
      #   genuinely invisible without the feature, so a red leg is not merely a
      #   broken crate. Measured: fuel-ir/serde, fuel-dispatch/
      #   telemetry+baracuda-types, fuel-correctness-fixtures/capture all
      #   DISCRIMINATE (leg 101, default 0, restored 0).
      #
      # ⚠️ WHAT THE STRONG FORM CAUGHT: this step was first written as
      # `--features baracuda-types` ALONE, which compiles NONE of that feature's
      # code — every `baracuda-types`-gated line in the crate lives inside
      # `telemetry/`, and `pub mod telemetry` is itself `#[cfg(feature =
      # "telemetry")]` (lib.rs:142). The leg would have been a PERMANENT GREEN
      # GATING NOTHING, the same defect as the `neon-dotprod` cell rejected
      # below. The weak born-red passed it. `--features telemetry,baracuda-types`
      # is the intersection that actually compiles it — one feature is not two.
      #
      # NOT strongly born-red: the `onnx` leg. That feature adds a DEPENDENCY
      # (`onnx = ["fuel-onnx"]`) rather than gating code in `fuel-examples`, so
      # there is no `#[cfg(feature = "onnx")]` region to seed; it has the weak
      # form only, and that is stated rather than left to be assumed (GAP-181:
      # an unproven step must not be called coverage).
      #
      # Pure-host, seconds-scale. `baracuda-types` is the one that looks
      # expensive and is not: it reaches `baracuda-cuda-sys`, whose build script
      # is a 321-byte PLACEHOLDER emitting only two `rerun-if-env-changed` lines,
      # with bindings pre-generated and vendored in-tree. No nvcc, no forge, and
      # — contrary to that feature's own Cargo.toml comment — no CUDA SDK for a
      # `check`. ⚠️ Unverifiable locally (this box HAS the SDK), so it must be
      # SEEN to run on a clean runner before being described as coverage.
      #
      # STILL UNCOVERED, named so a green badge does not imply otherwise:
      #   * 20 cells behind `cuda`/`cudnn`/`nccl`/`jit-synth` — measured with
      #     `cargo tree -e features` to pull `baracuda-kernels-sys`, which forges
      #     UNCONDITIONALLY (~93 min under load). A runner question, GAP-181.
      #   * 6 `accelerate` cells — Apple hardware, unbuildable anywhere here.
      #   * `fuel-quantized --features neon-dotprod` has no leg, and the reason
      #     recorded here has now been wrong TWICE, in OPPOSITE directions. The
      #     ORIGINAL conclusion was RIGHT; the architect's 2026-08-28 correction
      #     of it was WRONG and is retracted here.
      #     MEASURED: the SDOT arm (fuel-quantized/src/neon.rs:47-51) is TRIPLY
      #     gated - all(target_arch = "aarch64", target_feature = "dotprod",
      #     feature = "neon-dotprod") - and its intrinsic `vdotq_s32` is an
      #     UNSTABLE library feature (stdarch_neon_dotprod, rust#117224). The
      #     file's own doc says it "cannot compile on stable Rust", and CI is
      #     @stable. On ubuntu-24.04-arm the feature is ON and the arch matches,
      #     but the runner's baseline aarch64 does NOT set target_feature =
      #     "dotprod" - so the SDOT arm compiles ITSELF AWAY and an arm leg is a
      #     permanent green too. SAME vacuity as x86, DIFFERENT mechanism.
      #     WHY THE CORRECTION WAS WRONG, which is worth more than the fact: the
      #     architect confirmed the MATRIX HAS AN ARM RUNNER and inferred the
      #     cell was live there, without checking the GATE SET. The step cited
      #     as evidence ("Run with arm neon", line 158) is `cargo check
      #     --workspace` with DEFAULT features and RUSTFLAGS=-C
      #     target-feature=neon; it never enables `neon-dotprod` and never sets
      #     `dotprod`. "A runner exists" and "the cell compiles there" are
      #     different claims. The proposed seed gated all(feature, target_arch)
      #     was UNDER-gated by one cfg: it would redden a BROADER region than
      #     the SDOT code, which no stable leg reaches at all.
      #     THE PROPAGATION IS THE REAL COST: the lane that wrote the correct
      #     sentence rewrote it to match the architect's wrong correction, so a
      #     TRUE comment was edited into a FALSE one BY A COORDINATOR'S FIX. A
      #     correction is a claim and needs the same verification as the thing
      #     it corrects - it arrives wearing the costume of rigour, which is
      #     exactly why nobody re-checks it. Caught by a lane PRE-FLIGHTING the
      #     allocation instead of implementing it: disconfirming the
      #     coordinator's hypothesis WAS the deliverable.
      #     IF SDOT IS EVER TO BE COVERED: viable but not cheap - @nightly +
      #     RUSTFLAGS=-C target-feature=+dotprod + `-p fuel-quantized --features
      #     neon-dotprod` on ubuntu-24.04-arm makes all three cfgs true with the
      #     intrinsic available. A nightly-toolchain addition, not a
      #     seconds-scale leg. NOT TAKEN.
      #     STANDING RULE, which survives BOTH corrections unchanged: any
      #     target-gated feature must state the TARGET it was built for, or its
      #     green is unreadable. `skipped-everywhere` and
      #     `skipped-here-runs-there` are different states, and a RUN-level view
      #     cannot tell them apart - read STEP conclusions per job.
      - name: Check serde-gated fuel-ir (GAP-247)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-ir --features serde --all-targets
      - name: Check capture-gated correctness fixtures (GAP-247)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-correctness-fixtures --features capture --all-targets
      - name: Check baracuda-types-gated dispatch (GAP-247)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-dispatch --features telemetry,baracuda-types --all-targets
      - name: Check onnx-gated examples (GAP-247)
        # `fuel-examples` is Fuel's de-facto CONSTRUCTOR gate — the working
        # agreement's field-add rule depends on it building, because a struct
        # field added elsewhere breaks CONSTRUCTING crates and the defining
        # crate's own gate cannot see it. An uncompiled cell here disables that
        # check, so the rot would not merely break an example.
        # Needs `protoc` (fuel-onnx's build script); installed earlier in this job.
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-examples --features onnx --all-targets

      # ⚠️ UNPROVEN ON A CLEAN RUNNER — THIS STEP EXISTS TO BE OBSERVED.
      # `fuel-cpu-backend --features mkl` had NINETEEN errors and had not
      # compiled since the edition-2024 migration; fixed in 5617a617. It is a
      # DEFAULT-MEMBER, so every job builds the crate while the rot sat behind a
      # non-default feature and the exclude list gave no hint.
      #
      # WHY IT IS NOT SIMPLY ADDED: `intel-mkl-src 0.8.1` CAN source MKL by
      # ocipkg download, so in principle no preinstalled SDK is needed. On the
      # development box it did NOT download — the build script emitted
      # `cargo:rustc-link-search=C:/Program Files (x86)/Intel/oneAPI/2026.1\lib`
      # and `~/.cache/ocipkg` does not exist. So the local green comes entirely
      # from that machine HAVING oneAPI, and the download path a runner must
      # take is completely unexercised there. Landing this on the strength of a
      # local pass would be an inference, not a measurement (GAP-181).
      #
      # This step is therefore the EXPERIMENT: if ocipkg fetches MKL on
      # ubuntu-latest, the leg earns its place with evidence; if it does not,
      # the "no leg" decision becomes CHOSEN rather than assumed, and the
      # constraint is measured. Precedent both ways: the `baracuda-types` cell
      # was proven CI-viable by observation against a Cargo.toml comment
      # asserting it needed the SDK.
      #
      # BORN-RED, strong form, measured locally before this PR: seeding
      # `const .. = <undefined>;` in `fuel-cpu-backend/src/mkl.rs` (a module
      # compiled only under the feature) gives LEG=101 with DEFAULT=0 — the
      # second half proving the seed is invisible without the feature, so a red
      # leg is not merely a broken crate. Restored clean.
      #
      # ✅ EXPERIMENT RESOLVED — run 33134436974, PR #26, Check (ubuntu-latest):
      # this step PASSED in 39s on a runner with no preinstalled MKL, so ocipkg
      # does fetch it and the leg is viable. The cost caveat written here before
      # the run ("may pull a large archive, read the duration before calling it
      # cheap") is now MEASURED rather than feared: 39s against 25s for the onnx
      # leg and 3-6s for the pure-host ones. Comparable, not exceptional.
      # Recorded because the pre-run guess and the measurement disagreed, and
      # the guess is the kind that would otherwise have justified never trying.
      - name: Check mkl-gated cpu backend (GAP-247, EXPERIMENT)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fuel-cpu-backend --features mkl --all-targets

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      # The `check` job above already sets this; `test` did not, and the
      # asymmetry destroys data exactly when it is most wanted. On the first run
      # where the suite could execute at all, macOS failed and ubuntu + windows
      # were CANCELLED mid-run — so a triage of "what is actually broken"
      # returned one OS out of three, and the other two reported `cancelled`,
      # which is not a result in either direction.
      #
      # Test failures are usually PLATFORM-SPECIFIC, so cancelling the siblings
      # of a failure discards the most informative comparison available: did
      # this break everywhere, or only here?
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Remove cargo config (macOS ring crate fix)
        if: runner.os == 'macOS'
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      # `fuel-onnx`'s build script calls `prost_build::compile_protos`, and
      # prost-build 0.13 does NOT bundle a `protoc` (dropped in 0.11) — so
      # without one the crate fails at BUILD SCRIPT time, before compiling a
      # line, and takes the whole `--workspace` job with it.
      #
      # INSTALLED rather than excluded, deliberately, and the distinction from
      # the exclusion list above is the point: CUDA / oneMKL / AOCL / Metal are
      # heavy or platform-impossible on a hosted runner, so excluding them is
      # the only option and costs real coverage. `protoc` is a small package
      # available on every platform, so installing it KEEPS fuel-onnx covered
      # for a few seconds of CI time. Prefer installing a missing tool over
      # excluding a crate whenever the tool is actually installable.
      - name: Install protoc (fuel-onnx build script)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lld (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      # `--no-fail-fast`: cargo stops after the FIRST failing test BINARY by
      # default, so every later suite silently never runs. Measured on this
      # repo: a run that halted in fuel-core's `paged_decode_parity` executed
      # 21 `test result:` suites; with that one failure fixed the same job
      # executed 72 — and the extra 51 contained a REAL pre-existing defect
      # (MaskedFill Vulkan precision coverage) that no CI run had ever reached.
      #
      # Same masking as the matrix `fail-fast` above, one level down: there a
      # failing OS cancelled its siblings, here a failing BINARY cancels every
      # binary after it. Triage needs the whole list, not the first entry.
      - name: Run tests (with lld on Linux)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo test --workspace --no-fail-fast ${{ env.WORKSPACE_EXCLUDES }}
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-fail-fast ${{ env.WORKSPACE_EXCLUDES }}
      # macOS gets its OWN exclusion set, and the difference is the point: this
      # runner CAN build the Metal crates (objc2 is happy on Apple), so
      # excluding them here would throw away the only Metal test coverage in the
      # matrix. It still cannot build `fuel-mkl-cpu-backend` — `onemkl-sys`
      # needs a oneMKL install that no hosted runner has, which is a
      # platform-independent gap. Two exclusions for two different reasons; do
      # not collapse them into one list.
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --no-fail-fast ${{ env.MACOS_EXCLUDES }}
      - name: Run telemetry-gated dispatch tests (sk4 wire codec)
        # `always() &&` is LOAD-BEARING, not defensive. Without it this step is
        # skipped whenever ANY earlier step in the job fails — and on a CI
        # summary page a SKIPPED step and a PASSED step are visually identical.
        # Measured 2026-08-19: this conformance gate had not executed in CI at
        # all, because the `Run tests` step ahead of it was red. A conformance
        # gate that silently does not run is worse than an absent one; the
        # absent one prompts the question. The gate is independent of the step
        # before it, so there is no reason for its result to be conditional on
        # that step's.
        if: always() && runner.os == 'Linux'
        # `cargo test --workspace` above uses DEFAULT features, so the
        # telemetry-gated tests — notably
        # `fuel_emits_only_recognized_sk4_dtype_spellings` — BUILD but never RUN
        # there. Compiling telemetry-gated code proves it BUILDS, never that its
        # assertions HOLD: "the feature is compiled" (the Check job's
        # `check -p fuel-dispatch --features telemetry --all-targets`, which we
        # KEEP — it compiles benches/examples this step does not) and "the
        # feature's tests ran" are DIFFERENT claims, and only the second catches
        # `FUEL_SK4_SPELLINGS` drifting. That is exactly how a red sk4 spelling
        # test reached main (the Bool cut was gated with `--lib`, which does not
        # build `tests/`). This step makes the second claim; the test is
        # OS-independent so one platform suffices. It ALSO fails on a ZERO test
        # count: a filter or an unbuilt target that runs nothing exits 0 too (the
        # `running 0 tests` trap). NOTE: rust-ci.yml is red on content, so this
        # RUNS AND REPORTS; it is NOT "enforced by CI" until the workflow is
        # green. GAP-173 residual / today's red #1.
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP:-/tmp}/sk4-telemetry-test.log"
          cargo test -p fuel-dispatch --features telemetry 2>&1 | tee "$out"
          st=${PIPESTATUS[0]}
          [ "$st" -eq 0 ] || exit "$st"
          grep -qE 'test result: ok\. [1-9]' "$out" \
            || { echo '::error::telemetry test step ran ZERO tests — a filter, a missing feature gate, or unbuilt test targets. This step exists specifically to not be blind; see GAP-173.'; exit 1; }
          # The count above proves SOMETHING ran, not that the sk4 test did:
          # `cargo test` emits one `test result:` line per suite, so if the lib
          # suite runs 800 and the integration target holding the byte-match runs
          # zero (gated away / renamed / excluded), the count guard passes on the
          # lib's number alone — the exact drift this step exists to catch, one
          # level in. So also require the specific test by name. A legitimate
          # RENAME of the test is a valid reason to update this line.
          grep -q 'fuel_emits_only_recognized_sk4_dtype_spellings' "$out" \
            || { echo '::error::the sk4 byte-match test (fuel_emits_only_recognized_sk4_dtype_spellings) did not run — its integration target was gated away, renamed, or excluded. If it was RENAMED, update this grep; otherwise re-enable the target. See GAP-173.'; exit 1; }

  conflict-markers:
    name: Conflict markers
    runs-on: ubuntu-latest
    # ENFORCEMENT half of the conflict-marker guard. The hook half
    # (scripts/hooks/pre-commit) is FAST FEEDBACK before a commit; this is what
    # actually holds, because it cannot be bypassed by declining to install a
    # hook and it requires no mutation of shared machine state.
    #
    # WHY THE GUARD EXISTS: every line-oriented checker in this repo is blind to
    # conflict markers BY CONSTRUCTION -- check-gaps-table.py keys on
    # `^| ~*GAP-`, method_rules_index_join.rs on `^## `, doc_declared_traits.rs
    # on rust fences. A marker begins with `<`, `=` or `>`, so none of those
    # patterns can match one: both sides of a conflict are read as ordinary
    # content, totals go UP, and every gate reports clean. Measured 2026-09-02:
    # the gaps gate returned exit 0 on a conflicted docs/gaps.md three times.
    # `git add` marks a conflicted file RESOLVED, so no local layer sees it.
    #
    # Cheap and unconditional on purpose: a grep over tracked files, seconds,
    # no toolchain, no matrix.
    steps:
      - uses: actions/checkout@v6
      - name: Reject unresolved conflict markers
        run: |
          set -eu
          # BUILT, never written: a literal seven-run in this file would make
          # the scan below flag the workflow itself.
          lt=$(printf '<%.0s' 1 2 3 4 5 6 7)
          eq=$(printf '=%.0s' 1 2 3 4 5 6 7)
          gt=$(printf '>%.0s' 1 2 3 4 5 6 7)
          # ONE pattern, used by the self-test AND the scan. The pattern is the
          # detector; validating a copy of it would prove nothing.
          pat="^(${lt}|${gt})|^${eq}"'$'

          # RETAINED SELF-TEST, run every time. This leg is green on virtually
          # every push forever, so it has NO evidence from live data, ever --
          # the fixture is not a supplement to real-world evidence, it is the
          # only evidence available. A dirty fixture MUST flag; a clean one
          # containing bare `<`, `=`, `>` MUST NOT.
          tmp=$(mktemp -d)
          printf 'a\n%s x\nb\n%s\nc\n%s y\n' "$lt" "$eq" "$gt" > "$tmp/dirty"
          printf 'a\nb < c\nd = e\nf > g\n' > "$tmp/clean"
          d=$(grep -cE "$pat" "$tmp/dirty" || true)
          c=$(grep -cE "$pat" "$tmp/clean" || true)
          rm -rf "$tmp"
          if [ "$d" != "3" ] || [ "$c" != "0" ]; then
            echo "conflict-marker detector FAILED its own fixture:"
            echo "  sabotaged fixture matched $d lines (want 3)"
            echo "  clean fixture matched $c lines (want 0)"
            echo "The check is inert -- fix the pattern, do not relax the test."
            exit 1
          fi

          # Output captured rather than relying on the exit code: xargs returns
          # 123 when ANY invocation exits non-zero, so a mixed run of matching
          # and non-matching batches is indistinguishable from a clean one.
          hits=$(git ls-files -z | xargs -0 grep -InE "$pat" || true)
          if [ -n "$hits" ]; then
            echo "UNRESOLVED CONFLICT MARKERS in tracked files:"
            echo "$hits"
            echo ""
            echo "Every line-oriented gate in this repo is structurally blind to"
            echo "these and reports CLEAN on a conflicted file. Resolve by READING"
            echo "BOTH SIDES: taking one wholesale can silently revert another"
            echo "lane's landed work while every gate still passes."
            exit 1
          fi
          echo "no conflict markers in $(git ls-files | wc -l) tracked files"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # See the identical step in the `check` job for why protoc is INSTALLED
      # rather than fuel-onnx being excluded.
      - name: Install protoc (fuel-onnx build script)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Runs on ubuntu-latest, so it needs the full non-Apple exclusion set —
      # clippy compiles what it lints, and would die on `objc2` exactly as
      # `cargo check` does.
      - run: cargo clippy --workspace --tests --examples --benches ${{ env.WORKSPACE_EXCLUDES }} -- -D warnings
      # GAP-242: the workspace leg above enables `fuel-dispatch/vulkan` through
      # feature unification, so it never lints the crate at DEFAULT features --
      # the configuration a developer gets from the natural
      # `cargo clippy -p fuel-dispatch`. That gap hid 110 warnings from every
      # CI job while the terminal showed them, and it regenerates every time
      # someone runs the obvious command.
      #
      # Scoped to `-p fuel-dispatch` rather than the workspace: this leg exists
      # to close a divergence measured in THIS crate, and a workspace-wide
      # default-features run is a different, larger claim nobody has measured.
      #
      # `--no-deps` is load-bearing, not tidiness: `-p <crate>` LINTS PATH
      # DEPENDENCIES TOO, so without it `-D warnings` promotes a dependency's
      # warnings into this leg's failure. Measured while writing this step --
      # the first version died on `fuel-hardware` (lib), a crate this leg makes
      # no claim about. A gate that fails for something outside its own scope
      # reports the wrong subject.
      - name: Clippy (fuel-dispatch, DEFAULT features - GAP-242)
        run: cargo clippy -p fuel-dispatch --no-deps --all-targets -- -D warnings
 