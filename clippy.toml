# `too_many_arguments` is CALIBRATED for this domain, not suppressed: there are NO
# per-item `#[allow]`/`#[expect]` for it anywhere (PM ruling 2026-10-17; the 256
# that existed were removed in the PR that wrote this block), and this file is the
# one place the policy lives.
#
# Kernel entry points here carry the operand buffers, strides and dims of an op
# ABI (input / weight / bias / scale / zero_point / stride / padding / dilation /
# groups is nine before anything unusual happens), and bundling them into a struct
# obscures the signature rather than clarifying it. So the threshold is the
# MEASURED MAXIMUM of the kernel-dispatch code, and the lint still fires above it.
#
# MEASURED, two ways, at origin/main 6411a54c5 (0.20.8) plus the removal of every
# per-item attribute:
#
#   (1) COMPILER, CI's clippy scope (`--workspace --tests --examples --benches`
#       minus the five WORKSPACE_EXCLUDES crates), threshold set to clippy's
#       default 7, fresh target dir. 237 distinct flagged sites:
#           8 args: 91   9: 51   10: 25   11: 20   12: 13   13: 7   14: 8
#           15: 4   16: 2   17: 6   18: 4   19: 5   20: 1
#       Max 20: `flash_attn_backward_bytes_impl` (fuel-vulkan-backend).
#   (2) HAND COUNT of the crates CI does not lint (CUDA needs the forge, Metal
#       needs macOS): fuel-cuda-backend max 19 (`flash_decoding_run`),
#       fuel-metal-kernels max 22 (`call_sdpa_full`, counted by eye: 22
#       parameters). These are NOT compiler-verified here.
#
# 22 is the highest of the two, so every kernel entry point passes, including the
# Metal one nothing on this box compiles. The compiler-verified in-scope maximum
# is 20; if Metal's 22 is ever reduced, lower this to the new measured maximum.
#
# Not every site is a kernel: `fuel_tensor::inference_context::new` (19) and a
# handful of `fuel-graph` builders (<= 18) sit under the threshold too. They were
# allowed before and are not outliers against a kernel-derived bound; if one is
# worth a struct it is a design change for its own PR, not a lint exemption.
too-many-arguments-threshold = 22
