[package]
name = "fuel-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
fuel-aocl-cpu-backend = { workspace = true, optional = true }
fuel-mkl-cpu-backend = { workspace = true, optional = true }
fuel-ir = { workspace = true, features = ["serde"] }
fuel-cpu-kernels = { workspace = true }
fuel-backend-contract = { workspace = true }
fuel-correctness-fixtures = { workspace = true, features = ["serde", "capture"] }
fuel-cpu-backend = { workspace = true }
fuel-hardware = { workspace = true }
fuel-kv-pool = { workspace = true }
fuel-dispatch = { workspace = true }
fuel-memory = { workspace = true }
bytemuck = { workspace = true }
fuel-formats = { workspace = true }
fuel-loaders = { workspace = true }
fuel-graph = { workspace = true }
# board #109: Tensor/Device/pipelined_bridge/judge/etc moved here; this crate
# keeps re-exporting their old paths (lib.rs), and train.rs/kv_block_pool.rs
# (not yet moved) reference them internally.
fuel-tensor = { workspace = true }
hf-hub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fuel-cuda-backend = { workspace = true, optional = true }
fuel-vulkan-backend = { workspace = true, optional = true }
fuel-metal-backend = { workspace = true, optional = true }
fuel-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
# baracuda CUDA FFI — fuel-core needs the traits + driver + cudnn + nccl
# optionally; the sub-crates are pulled individually so the feature graph
# stays explicit.
baracuda-types  = { workspace = true, optional = true }
baracuda-core   = { workspace = true, optional = true }
baracuda-driver = { workspace = true, optional = true }
baracuda-cudnn  = { workspace = true, optional = true }
baracuda-nccl   = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true }
float8 = { workspace = true }
image = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libm = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["fancy-regex"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
# Telemetry flush tests write JSONL to a scratch dir.
tempfile = { workspace = true }
# Direct-conv parity oracle for the CV1 im2col-recipe realize test.
fuel-conv = { workspace = true }
# Q4_0 dequantize-then-matmul oracle (incc_qmatmul_q4_0_oracle) — used
# directly, not through the (now-deleted) `fuel_core::quantized` shim.
fuel-quantized = { workspace = true }
# GAP-157: `require`/`required` — a missing device is a FAILURE, not a silent
# early return that reports `ok` having asserted nothing.
fuel-test-support = { workspace = true }

[features]
# CPU-only build is the default. Omitting all GPU features produces a clean
# CPU-only binary with zero GPU code compiled in.
default = []

# Baracuda dispatch-telemetry / miss-reporting emission (production consumer).
# Enables fuel-dispatch's plan-time emission + adds the process-wide opt-in
# sink, hardware stamp, and explicit-flush API. Off by default — a build that
# never sets this is byte-identical. Pure pass-through now (GAP-347 PR 1):
# the `fuel_core::telemetry` module this once gated was deleted (zero real
# consumers; `fuel`'s facade re-exports `fuel_dispatch::telemetry::judge_sink`
# directly). Kept so anything still enabling `fuel-core/telemetry` transitively
# still turns the real feature on downstream.
telemetry = ["fuel-dispatch/telemetry", "fuel-tensor/telemetry"]

# NVIDIA GPU backend via baracuda (cuBLAS + driver). Dynamic-loaded at
# runtime; cargo build does not require the CUDA toolkit installed.
# Use: cargo build --features cuda
#
# board #109: the actual bridge code (`cuda_backend`, `device`, `lazy`, ...)
# moved to fuel-tensor, so this feature must forward to fuel-tensor's own
# "cuda" -- otherwise fuel-core's `#[cfg(feature = "cuda")]` re-exports
# (lib.rs) would gate correctly while fuel-tensor's OWN `#[cfg(feature =
# "cuda")]`-gated internals (the moved code's real content) stayed off,
# since the two crates' features are otherwise independent flags.
cuda = [
    "dep:fuel-cuda-backend",
    "dep:baracuda-types",
    "dep:baracuda-core",
    "dep:baracuda-driver",
    "fuel-dispatch/cuda",
    "fuel-memory/cuda",
    "fuel-hardware/cuda",
    "fuel-tensor/cuda",
]

# Enables cuda + cuDNN accelerated convolution and normalization.
cudnn = ["cuda", "dep:baracuda-cudnn", "fuel-cuda-backend?/cudnn", "fuel-tensor/cudnn"]

# Multi-GPU communication via NVIDIA NCCL.
nccl = ["cuda", "dep:baracuda-nccl", "fuel-cuda-backend?/nccl", "fuel-tensor/nccl"]

# Intel MKL BLAS for CPU (Linux/Windows). Faster matmul on Intel hardware.
mkl = ["dep:libc", "dep:intel-mkl-src", "fuel-cpu-backend/mkl", "fuel-tensor/mkl"]

# AMD AOCL-BLAS (BLIS) for CPU. Faster matmul on Zen-class AMD CPUs.
# Links via the out-of-tree `aocl-blas` crate; runs the 2×2 sgemm probe
# at startup and bails gracefully if libaocl_blas is missing. AOCL
# kernels register as `kernel_source` siblings of BackendId::Cpu on the
# binding table; the picker selects them empirically (the legacy
# fuel-graph-router/aocl routing edge was retired with the
# `judge::cached()` Router branch, executor-unification Session 3).
aocl = ["dep:fuel-aocl-cpu-backend"]

# Intel oneMKL CPU backend for the lazy-graph layer (Phase 7b). Distinct
# from the legacy `mkl` feature above (which feeds the eager fuel-cpu-
# backend's intel-mkl-src linkage). `onemkl` is the lazy-graph path,
# loading mkl_rt at runtime via the `onemkl` crate. Both can coexist;
# the Judge-fed picker chooses empirically per binding-table cell.
onemkl = ["dep:fuel-mkl-cpu-backend"]

# Apple Accelerate BLAS for CPU (macOS only). Faster matmul on Apple hardware.
accelerate = ["dep:libc", "dep:accelerate-src", "fuel-cpu-backend/accelerate", "fuel-tensor/accelerate"]

# Apple Metal GPU backend (macOS 13+, Apple Silicon or AMD GPU on Intel Mac).
# Use: cargo build --features metal
metal = [
    "dep:fuel-metal-backend",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:fuel-metal-kernels",
    "fuel-dispatch/metal",
    "fuel-memory/metal",
    "fuel-tensor/metal",
]

# Cross-vendor GPU backend via Vulkan (vulkane + precompiled SPIR-V).
# Use: cargo build --features vulkan. No toolchain required at build
# time — shaders are precompiled and committed.
vulkan = ["dep:fuel-vulkan-backend", "fuel-dispatch/vulkan", "fuel-memory/vulkan", "fuel-hardware/vulkan", "fuel-tensor/vulkan"]

# Pipes the `ug` feature through to fuel-cuda-backend and fuel-metal-backend so the
# per-backend `XxxUgIOp1::new(..., device)` constructors are available
# whenever `cuda`/`metal` is also enabled.

# NOTE: fuel-core has no examples. The four that lived here (`basics`,
# `cuda_basics`, `metal_basics`, `cuda_sum_benchmark`) were all eager-`Tensor`
# demos and were deleted with the rest of the eager surface. Lazy examples live
# in `fuel-lazy-examples`.
