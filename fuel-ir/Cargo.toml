[package]
    categories.workspace = true
    description          = "Core types and traits for the fuel ML framework"
    edition.workspace    = true
    keywords.workspace   = true
    license.workspace    = true
    name                 = "fuel-ir"
    repository.workspace = true
    version.workspace    = true

[dependencies]
    float8      = { workspace = true }
    half        = { workspace = true }
    libm        = { workspace = true }
    num-traits  = { workspace = true }
    safetensors = { workspace = true }
    serde       = { workspace = true, optional = true, features = ["derive"] }
    serde_json  = { workspace = true, optional = true }
    smallvec    = { workspace = true }
    thiserror   = { workspace = true }
    zip         = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]

[features]
# Declared but EMPTY, and deliberately so. `ug` no longer pulls a dependency —
# the ug integration was removed wholesale (it was Candle-inherited, feature-gated,
# and Fuel never constructed a ug::Kernel). This flag survives only to keep the
# `Error::Ug` variant compiling for anyone who enabled it, so its removal is a
# deliberate act at the next BREAKING release rather than a side effect of this
# cleanup. Without the declaration the variant's `#[cfg(feature = "ug")]` becomes
# an `unexpected_cfgs` warning, which CI denies.
# DELETE the feature AND the Error::Ug variant together at the next major bump.
ug      = []
    default = []
    # FDX — the Fuel DLPack eXtension (docs/specs/dlpack-extension.md): a
    # versioned, optional sidecar over standard DLPack for the kernel boundary.
    # POD structs + the normative FDX code tables; no extra deps yet.
    dlpack  = []
    # Enable `#[derive(Serialize, Deserialize)]` on persistence-shaped types
    # (device probe descriptors, later Judge output). Kept opt-in so downstream
    # crates that don't need serde avoid the compile cost. Pulls serde_json so
    # the persistence-shaped types can also expose `save`/`load` directly.
    serde   = ["dep:serde", "dep:serde_json"]
