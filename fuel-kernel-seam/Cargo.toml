[package]
    categories.workspace = true
    description          = "Kernel-seam JIT-on-request envelope: JitRequest / JitResponse + the Synthesizer trait — the live-call protocol between Fuel and a JIT kernel backend"
    edition.workspace    = true
    keywords.workspace   = true
    license.workspace    = true
    name                 = "fuel-kernel-seam"
    repository.workspace = true
    version.workspace    = true

# The envelope bridges the two halves of the seam: Fuel's region grammar
# (fuel-kernel-seam-types) and the synthesizer's operand projection
# (unpopped-vocab's OperandDesc, the structure_key input). Light by design — no fuel-graph — so a
# synthesizer backend depends on it cheaply. The vocabulary types are DEFINED in unpopped-vocab
# (baracuda-kernels-types only re-exports them), so this crate depends on unpopped-vocab directly:
# a dependency on baracuda-kernels-types made baracuda's own graph carry two copies of it.
[dependencies]
    unpopped-vocab         = { workspace = true }
    fuel-kernel-seam-types = { workspace = true }
