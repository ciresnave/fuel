[package]
name = "fuel-kiss-ref-backend"
version = "0.1.0"
edition = "2024"
description = "CPU, never-panic adapter exposing kiss-ref-core as Fuel's primitive-floor reference / differential target (correctness only; no fusion, no GPU)."

[dependencies]
fuel-ir = { path = "../fuel-ir" }
fuel-kernel-seam-types = { path = "../fuel-kernel-seam-types" }
half = { workspace = true }
# kiss-ref (github.com/ThinkersJournal/kiss-ref) — all three crates from the one
# workspace repo at a pinned rev. Bump the rev in lockstep.
#
# Status (corrected 2026-07-29): `kiss-ref-core` 0.1.0 IS published on crates.io.
# The previous note here — "private … crates.io is deliberately NOT used until
# kiss-ref is public-ready" — was stale. Fuel still pins a git rev deliberately:
# the seam tracks unreleased changes and the three crates must move in lockstep.
# Moving to the published crate is a separate decision, not a consequence of
# publication.
kiss-ref-core       = { git = "https://github.com/ThinkersJournal/kiss-ref", rev = "e8ae0b58cf420851af003f5134ecea9585c393a5" }
kiss-ops-vocab      = { git = "https://github.com/ThinkersJournal/kiss-ref", rev = "e8ae0b58cf420851af003f5134ecea9585c393a5" }
kiss-classify-vocab = { git = "https://github.com/ThinkersJournal/kiss-ref", rev = "e8ae0b58cf420851af003f5134ecea9585c393a5" }
