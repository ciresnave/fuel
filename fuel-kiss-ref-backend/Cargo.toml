[package]
name = "fuel-kiss-ref-backend"
version = "0.1.0"
edition = "2024"
description = "CPU, never-panic adapter exposing kiss-ref-core as Fuel's primitive-floor reference / differential target (correctness only; no fusion, no GPU)."

[dependencies]
fuel-ir = { path = "../fuel-ir" }
fuel-kernel-seam-types = { path = "../fuel-kernel-seam-types" }
half = { workspace = true }
# kiss-ref (github.com/ThinkersJournal/kiss-ref) — all three crates from the one
# workspace repo, tracked as PUBLISHED RELEASES (CireSnave, 2026-07-29: always
# prefer published crates where possible). Moved off the git-rev pin at 0.2.0.
#
# Lockstep is preserved by pinning all three at the same published minor: they
# publish together at matching versions. The caret's auto-uptake is bounded by
# kiss-ref's release discipline — `"0.3"` accepts only non-breaking 0.3.z, and
# any breaking change goes to a 0.x-minor bump the caret will not pull. That
# discipline was established by shipping the ScalarFloat seal + Node::ConstBits
# + required from_bits as 0.2.0 rather than 0.1.1, precisely so surprise-
# immunity is structural rather than something a rev pin has to buy.
#
# What this gives up vs a rev pin: tracking UNRELEASED main. That is the healthy
# direction — being blocked on an unreleased kiss-ref change is a signal to cut
# a release, not to track a rev.
kiss-ref-core       = "0.3"
kiss-ops-vocab      = "0.3"
kiss-classify-vocab = "0.3"
