[package]
    categories.workspace = true
    description          = "Model-loading support for the fuel ML framework — HF config.json resolution rules, load-progress reporting, and GGUF/imatrix/tokenizer glue over fuel-formats' wire parsers. Knows nothing about Tensor, Storage, or Device."
    edition.workspace    = true
    keywords.workspace   = true
    license.workspace    = true
    name                 = "fuel-loaders"
    repository.workspace = true
    version.workspace    = true

[dependencies]
    fuel-backend-contract = { workspace = true }
    fuel-formats          = { workspace = true }
    fuel-ir               = { workspace = true }
    fuel-quantized        = { workspace = true }
    safetensors           = { workspace = true }
    yoke                  = { workspace = true }

# Slice 3 added `safetensors.rs`, which is NOT `#[cfg(not(target_arch =
# "wasm32"))]` in fuel-core (it must attempt to build on every target) and
# uses `memmap2` unconditionally -- so memmap2 moved back to plain
# [dependencies] here, reversing Slice 2's gating decision now that this
# crate's composition has changed (that decision's own comment anticipated
# this: "that crate also uses it from safetensors.rs, which is not part of
# this crate" -- it now is).
    memmap2 = { workspace = true }

# `gguf_mmap` and `tokenizer` are both `#[cfg(not(target_arch = "wasm32"))]`
# (fuel-core/src/quantized/mod.rs's original gating, preserved on the move).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
    tokenizers = { workspace = true, features = ["fancy-regex"] }
