[package]
name = "fuel-metal-kernels"
version.workspace = true
edition = "2021"

description = "Metal kernels for Fuel"
repository = "https://github.com/ciresnave/fuel"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"


[dependencies]
half             = { workspace = true }
once_cell        = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }

# Apple-only: gated so `cargo publish` verification builds (to an empty crate)
# on non-Apple hosts, matching fuel-metal-backend.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2            = { workspace = true }
objc2-metal      = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
clap       = { workspace = true }
half       = { workspace = true }
anyhow     = { workspace = true }
rand       = { workspace = true }
rand_distr = { workspace = true }
# Tolerance comparison (assert_all_close) instead of round-then-equal.
fuel-test-support = { path = "../fuel-test-support" }
# [profile.*] sections only belong in the workspace root; cargo
# warns when they appear in a non-root member. Removed.
