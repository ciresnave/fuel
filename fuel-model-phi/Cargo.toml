[package]
    categories.workspace = true
    description          = "The Phi-family lazy-graph decoder for the fuel ML framework."
    edition.workspace    = true
    keywords.workspace   = true
    license.workspace    = true
    name                 = "fuel-model-phi"
    repository.workspace = true
    version.workspace    = true

# Stepping-stone dependency, not the end state -- see fuel-model-llama's Cargo.toml
# and docs/session-prompts/fuel-core-dissolution-b1.md's shim-debt ledger.
[features]
    # Forwards to fuel-core's cuda feature -- see fuel-model-llama's Cargo.toml.
    cuda = ["fuel-tensor/cuda"]

[dependencies]
    # The cuda-gated capture path names `fuel_dispatch::pipelined::{CapturedDecodeSession, StorageCache}`;
    # the crate did not depend on it, so `--features cuda` failed with E0433 (found 2026-10-25).
    fuel-dispatch  = { workspace = true }
    fuel-graph     = { workspace = true }
    fuel-ir        = { workspace = true }
    # Added for hf_config's shim retirement (fuel-core dissolution,
    # GAP-347 PR 3): repoints this crate's `fuel_core::hf_config::` sites
    # to the real crate directly.
    fuel-loaders   = { workspace = true }
    fuel-quantized = { workspace = true }
    fuel-tensor    = { workspace = true }
    half           = { workspace = true }
    hf-hub         = { workspace = true }
    serde          = { workspace = true }
    serde_json     = { workspace = true }
