[package]
name = "fuel-nn"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

# The NN surface is built on `Tensor`, which lives in `fuel-tensor::lazy`, so
# fuel-nn is a CONSUMER of fuel-tensor. It imports the real crates directly (not
# the `fuel` facade): `fuel-ir` for errors/shapes, `fuel-tensor` for `Tensor`.
# (GAP-348: this crate used to depend on `fuel-core`, now dissolved.)
[dependencies]
fuel-tensor = { workspace = true }
fuel-ir = { workspace = true }
fuel-graph = { workspace = true }
fuel-loaders = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

[dev-dependencies]
fuel-quantized = { path = "../fuel-quantized" }
