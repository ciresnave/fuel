[package]
name = "fuel-parallel"
version.workspace = true
edition.workspace = true
description = "Multi-GPU parallelism primitives for the Fuel ML framework."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
    fuel   = { workspace = true }
    serde  = { workspace = true }
    # Backend crates, pulled in only by the matching feature. Needed because a
    # live multi-backend test must NAME its device: `VulkanBackend::with_selection`
    # is the only way to ask for the integrated GPU — `vulkan_backend::new_device()`
    # uses `PreferDiscrete`, which on a mixed box selects the *discrete* card and
    # would quietly make a "CUDA + Vulkan" test run both halves on the same vendor.
    fuel-cuda-backend   = { workspace = true, optional = true }
    fuel-vulkan-backend = { workspace = true, optional = true }

[dev-dependencies]
    # Only for the BF16 `WeightStorage` test. `Linear` is dtype-agnostic because
    # it delegates to `WeightStorage`; proving that needs a real bf16 value.
    half = { workspace = true }

[features]
    default = []

    # GPU passthrough. This crate holds no backend code of its own — the features
    # exist so a live multi-backend test here can reach real CUDA / Vulkan
    # devices, which `fuel`'s own defaults leave off. Without these, a test in
    # this crate can only ever construct `Device::cpu()`, so "multi-device" would
    # mean "several handles to the same host" and would prove nothing.
    cuda   = ["fuel/cuda", "dep:fuel-cuda-backend"]
    vulkan = ["fuel/vulkan", "dep:fuel-vulkan-backend"]
