[package]
    categories.workspace = true
    description          = "Fuel's user-facing Tensor handle and Device abstraction — the central, near-universal consumer surface of the former fuel-core (board #109; CireSnave: \"Move Tensor into fuel-tensor. We can worry about a semantic split later.\")"
    edition.workspace    = true
    keywords.workspace   = true
    license.workspace    = true
    name                 = "fuel-tensor"
    repository.workspace = true
    version.workspace    = true

# Dependency list copied verbatim from fuel-core's own [dependencies] (board
# #109, PR B/C: the mechanical Tensor-cluster move). Mechanical moves carry
# the full dependency surface forward rather than pruning to exactly what's
# referenced -- pruning is its own hygiene pass, not part of this move, and
# over-inclusion here is safe where under-inclusion (without a compile to
# catch it) is not.
[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
fuel-aocl-cpu-backend = { workspace = true, optional = true }
fuel-mkl-cpu-backend = { workspace = true, optional = true }
fuel-ir = { workspace = true, features = ["serde"] }
fuel-cpu-kernels = { workspace = true }
fuel-backend-contract = { workspace = true }
fuel-correctness-fixtures = { workspace = true, features = ["serde", "capture"] }
fuel-cpu-backend = { workspace = true }
fuel-hardware = { workspace = true }
fuel-dispatch = { workspace = true }
fuel-memory = { workspace = true }
bytemuck = { workspace = true }
fuel-formats = { workspace = true }
fuel-loaders = { workspace = true }
fuel-quantized = { workspace = true }
fuel-graph = { workspace = true }
fuel-kv-pool = { workspace = true }
hf-hub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fuel-cuda-backend = { workspace = true, optional = true }
fuel-vulkan-backend = { workspace = true, optional = true }
fuel-metal-backend = { workspace = true, optional = true }
fuel-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
# baracuda CUDA FFI -- needed optionally by fuel-cuda-backend's own feature
# graph (same reason fuel-core carried these before the move).
baracuda-types  = { workspace = true, optional = true }
baracuda-core   = { workspace = true, optional = true }
baracuda-driver = { workspace = true, optional = true }
baracuda-cudnn  = { workspace = true, optional = true }
baracuda-nccl   = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true }
float8 = { workspace = true }
image = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libm = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
yoke = { workspace = true }
zip = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["fancy-regex"] }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
fuel-conv = { workspace = true }
fuel-test-support = { workspace = true }

[features]
default = []
telemetry = ["fuel-dispatch/telemetry"]

cuda = [
    "dep:fuel-cuda-backend",
    "dep:baracuda-types",
    "dep:baracuda-core",
    "dep:baracuda-driver",
    "fuel-dispatch/cuda",
    "fuel-memory/cuda",
    "fuel-hardware/cuda",
]

cudnn = ["cuda", "dep:baracuda-cudnn", "fuel-cuda-backend?/cudnn"]

nccl = ["cuda", "dep:baracuda-nccl", "fuel-cuda-backend?/nccl"]

mkl = ["dep:libc", "dep:intel-mkl-src", "fuel-cpu-backend/mkl"]

aocl = ["dep:fuel-aocl-cpu-backend"]

onemkl = ["dep:fuel-mkl-cpu-backend"]

accelerate = ["dep:libc", "dep:accelerate-src", "fuel-cpu-backend/accelerate"]

metal = [
    "dep:fuel-metal-backend",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:fuel-metal-kernels",
    "fuel-dispatch/metal",
    "fuel-memory/metal",
]

vulkan = ["dep:fuel-vulkan-backend", "fuel-dispatch/vulkan", "fuel-memory/vulkan", "fuel-hardware/vulkan"]
