[package]
name = "fuel-transformers"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
fuel-core = { path = "../fuel-core", version = "0.10.3" }
fuel-cpu-backend = { workspace = true }
# Stage 2: the moved model zoo uses these Foundation + external crates directly
# (they were fuel-core's deps). Added as workspace deps — already declared in the
# root [workspace.dependencies], so NO root manifest change. DEFAULT features only,
# nothing requested: `cargo test --workspace` unifies features across the graph,
# and any feature the models need (e.g. fuel-ir/serde) is already turned on by
# fuel-core in the graph. This set must NOT grow features here.
fuel-dispatch = { workspace = true }
fuel-graph = { workspace = true }
fuel-ir = { workspace = true }
fuel-quantized = { workspace = true }
half = { workspace = true }
hf-hub = { workspace = true }
rand_distr = { workspace = true }
tokenizers = { workspace = true }
safetensors = { workspace = true }
image = { workspace = true }
fancy-regex = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_plain = { workspace = true }
tracing = { workspace = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "fuel-core/accelerate"]
cuda = ["fuel-core/cuda"]
cudnn = ["fuel-core/cudnn"]
mkl = ["dep:intel-mkl-src", "fuel-core/mkl"]
metal = ["fuel-core/metal"]

# Doctest-only. The crate-level "Quick start" example names
# `fuel_nn::varbuilder::VarBuilder`, which this crate does NOT depend on at
# build time — models here are constructed FROM a VarBuilder by the caller. The
# doctest still has to COMPILE, so the dependency is a dev-dep rather than the
# example being demoted to ```text: an illustrative block nothing checks is how
# a doc drifts from the API it describes.
#
# It broke because the fuel-nn EXTRACTION (2026-08-19) moved VarBuilder out of
# fuel-core, and `--all-targets` does NOT build doctests, so no gate here saw it.
[dev-dependencies]
fuel-nn = { workspace = true }
