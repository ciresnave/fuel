[package]
    categories.workspace = true
    description          = "Vulkan GPU executor for the fuel lazy-graph layer. Uses Vulkane for device management and precompiled SPIR-V from fuel-vulkan-kernels (sources in fuel-kernels-source)."
    edition.workspace    = true
    keywords.workspace   = true
    license.workspace    = true
    name                 = "fuel-vulkan-backend"
    repository.workspace = true
    version.workspace    = true

[dependencies]
    fuel-conv              = { workspace = true }
    fuel-ir        = { workspace = true }
    fuel-backend-contract = { workspace = true }
    fuel-graph             = { workspace = true }
    # Precompiled SPIR-V kernels. Sources live in fuel-kernels-source
    # and are compiled ahead of time (see
    # `fuel-kernels-source/kernels/compile.sh`) — vulkane does NOT
    # need its naga / shaderc / slang features at build or run time.
    # Fuel stays toolchain-free for downstream consumers.
    fuel-vulkan-kernels    = { workspace = true }
    half                   = { workspace = true }
    memmap2                = { workspace = true }
    tracing                = { workspace = true }
    # Flipped from the local path dep back to crates.io 2026-06-13: the
    # 0.7 budget/defrag APIs (vram_budget/vram_used, register_pressure_callback,
    # would_fit -> FitStatus, build/apply_defragmentation_plan) are validated
    # and published; crates.io version so a clean clone builds without the
    # ../vulkane sibling checkout. 0.8.2 (2026-06-19) adds the device-address
    # allocator (AllocatorOptions { buffer_device_address } / new_with_options)
    # required for the FDX Vulkan BDA path (spec §3.3.1): pooled-buffer device
    # addresses were invalid on strict drivers before 0.8.2.
    # 0.9.0 (2026-07-31) brings `driver_properties()` (portable driver identity
    # — RADV vs AMDVLK are distinct ICDs on the same silicon and do not make the
    # same codegen choices, which the raw vendor-packed `driver_version` u32
    # cannot express), `subgroup_properties()` (subgroup/wave width — 64 on the
    # AMD iGPU here, 32 on the 4070 — the primary kernel-specialization axis),
    # `effective_api_version()`, and `cooperative_matrix_properties()` losing
    # its `unsafe` qualifier. Note `SubgroupProperties::size_control` needs an
    # instance at V1_3; ours are V1_2, so it reads `None` regardless of device.
    vulkane                = "0.13.0"

[dev-dependencies]
# GAP-157: `require`/`required_ok` — a missing device is a FAILURE, not a
# silent early return that reports `ok` having asserted nothing.
fuel-test-support = { workspace = true }
    fuel-conv      = { workspace = true }
    fuel-core      = { path = "../fuel-core", features = ["vulkan"] }
    # Phase 7.5 G2: tests need a CpuBackendDevice handle for
    # slot-populating constructors (cpu_dev() helper).
    fuel-cpu-backend = { workspace = true }
