# The `fuel` facade crate.
#
# Before Stage 1, `fuel` was a manifest ALIAS for `fuel-core`; Stage 1 made it a
# real crate re-exporting `fuel-core`'s public surface, and GAP-348 dissolved
# `fuel-core` itself, so the same names are now re-exported from the crates that
# own them (src/lib.rs), and `use fuel::...` still resolves identically.
#
# Features are forwarded to the owning crates (`fuel-tensor` carries all ten
# backend features) — a consumer's `features = ["vulkan"]` must resolve on `fuel`,
# so every backend feature name has to exist here too.
[package]
name = "fuel"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Fuel — a DAG-first, lazy-only ML framework for Rust (the public facade)."
repository = "https://github.com/ciresnave/fuel"

[dependencies]
# The surface `fuel-core` used to carry is re-exported from the crates that own it
# (GAP-348, fuel-core dissolution). Each dependency below is here because
# src/lib.rs names it.
fuel-tensor = { path = "../fuel-tensor", version = "0.31.0" }
fuel-ir = { path = "../fuel-ir", version = "0.31.0" }
fuel-hardware = { path = "../fuel-hardware", version = "0.31.0" }
fuel-backend-contract = { path = "../fuel-backend-contract", version = "0.31.0" }
fuel-cpu-backend = { path = "../fuel-cpu-backend", version = "0.31.0" }
# `fuel::topology` and `fuel::telemetry` (telemetry feature) come from here.
fuel-dispatch = { path = "../fuel-dispatch", version = "0.31.0" }
# `fuel::kv_block_pool`.
fuel-kv-pool = { path = "../fuel-kv-pool", version = "0.31.0" }
# `fuel::hf_config`, `fuel::safetensors`, `fuel::quantized`.
fuel-loaders = { path = "../fuel-loaders", version = "0.31.0" }
# The model zoo (`pub use fuel_transformers::models::*`).
fuel-transformers = { path = "../fuel-transformers", version = "0.31.0" }

# Features forward to EVERY dependency that declares them, and to no dependency
# that does not (see fuel/tests/feature_forwarding.rs, which derives this rule
# from the manifests rather than hardcoding the split). `fuel-tensor` owns all
# ten backend features; fuel-transformers carries accelerate/cuda/cudnn/mkl/metal/
# vulkan (a strict subset), so those six forward to BOTH; telemetry/nccl/aocl/
# onemkl forward to fuel-tensor only. `telemetry` also forwards to
# `fuel-dispatch/telemetry` for the `fuel::telemetry` re-export.
[features]
default = []
telemetry = ["fuel-tensor/telemetry", "fuel-dispatch/telemetry"]
cuda = ["fuel-tensor/cuda", "fuel-transformers/cuda"]
cudnn = ["fuel-tensor/cudnn", "fuel-transformers/cudnn"]
nccl = ["fuel-tensor/nccl"]
mkl = ["fuel-tensor/mkl", "fuel-transformers/mkl"]
aocl = ["fuel-tensor/aocl"]
onemkl = ["fuel-tensor/onemkl"]
accelerate = ["fuel-tensor/accelerate", "fuel-transformers/accelerate"]
metal = ["fuel-tensor/metal", "fuel-transformers/metal"]
vulkan = ["fuel-tensor/vulkan", "fuel-transformers/vulkan"]
